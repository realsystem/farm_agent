name: Smoke Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f farm_agent/requirements.txt ]; then pip install -r farm_agent/requirements.txt; fi

    - name: Run smoke tests
      run: |
        cd farm_agent
        python -m pytest test_agent.py -v --tb=short 2>/dev/null || python -m unittest test_agent.py -v

    - name: Check Python syntax
      run: |
        python -m py_compile farm_agent/agent.py farm_agent/test_agent.py

  docker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Build Docker image
      run: |
        cd farm_agent
        docker build -t farm-agent:latest .

    - name: Verify Docker image
      run: |
        docker images | grep farm-agent
